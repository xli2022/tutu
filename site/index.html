<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tutu — a little arcade of web apps</title>
    <meta name="description" content="tutu is a small collection of self-contained web apps. Start with Sugarsnap, a triple-match candy puzzle." />
    <meta name="theme-color" content="#2b1b5e" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/hub.css" />
  </head>
  <body>
    <div class="backdrop"></div>

    <!-- Gradient used by the hub card icons. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <linearGradient id="hubGloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff" />
          <stop offset="55%" stop-color="#ffe3f1" />
          <stop offset="100%" stop-color="#ffb3da" />
        </linearGradient>
      </defs>
    </svg>

    <main class="page">
      <header class="masthead">
        <h1 class="logo wordmark">tutu</h1>
        <p class="tagline">
          A little arcade of self-contained web apps. No installs, no accounts —
          just open one and play.
        </p>
        <p><span class="shelf-label"><span id="app-count">1 app</span><span>on the shelf</span></span></p>
      </header>

      <h2 class="sr-only">Apps</h2>
      <div class="app-grid" id="app-grid"></div>

      <footer class="site-foot">
        <p>
          Built as a static site and deployed straight to GitHub Pages —
          <a href="https://github.com/xli2022/tutu">source on GitHub</a>.
        </p>
      </footer>
    </main>

    <script src="assets/apps.js"></script>
    <script src="assets/hub.js"></script>
  </body>
</html>
