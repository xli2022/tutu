<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sugarsnap — tutu</title>
    <meta name="description" content="A triple-match candy puzzle. Tap candies into your tray, collect three of a kind to pop them, and clear the board." />
    <meta name="theme-color" content="#2b1b5e" />
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../assets/site.css" />
    <link rel="stylesheet" href="sugarsnap.css" />
  </head>
  <body>
    <div class="backdrop"></div>

    <!-- ── Candy artwork ──────────────────────────────────────────────
         Eight pieces, each a distinct SHAPE as well as a distinct hue so
         the board stays readable without relying on colour alone.     -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff8a9b"/><stop offset="100%" stop-color="#e8243f"/></linearGradient>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffbe6b"/><stop offset="100%" stop-color="#f2701a"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe680"/><stop offset="100%" stop-color="#f5b813"/></linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9ff08a"/><stop offset="100%" stop-color="#34a43a"/></linearGradient>
        <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8fd4ff"/><stop offset="100%" stop-color="#1878d4"/></linearGradient>
        <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c9a6ff"/><stop offset="100%" stop-color="#7433d1"/></linearGradient>
        <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffa8d8"/><stop offset="100%" stop-color="#e0328f"/></linearGradient>
        <linearGradient id="g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8ff0e2"/><stop offset="100%" stop-color="#12a596"/></linearGradient>

        <!-- 0 · jelly bean -->
        <symbol id="candy-0" viewBox="0 0 100 100">
          <ellipse cx="50" cy="52" rx="35" ry="27" fill="url(#g0)" transform="rotate(-20 50 52)"/>
          <ellipse cx="38" cy="38" rx="13" ry="7" fill="#fff" opacity=".62" transform="rotate(-28 38 38)"/>
          <ellipse cx="64" cy="66" rx="12" ry="6" fill="#000" opacity=".13" transform="rotate(-20 64 66)"/>
        </symbol>

        <!-- 1 · wrapped candy -->
        <symbol id="candy-1" viewBox="0 0 100 100">
          <path d="M6 26 L32 50 L6 74 Z" fill="url(#g1)"/>
          <path d="M94 26 L68 50 L94 74 Z" fill="url(#g1)"/>
          <circle cx="50" cy="50" r="27" fill="url(#g1)"/>
          <circle cx="50" cy="50" r="27" fill="#fff" opacity=".1"/>
          <ellipse cx="40" cy="39" rx="10" ry="6" fill="#fff" opacity=".66" transform="rotate(-28 40 39)"/>
        </symbol>

        <!-- 2 · lemon drop -->
        <symbol id="candy-2" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="31" fill="url(#g2)"/>
          <circle cx="50" cy="50" r="21" fill="#fff" opacity=".2"/>
          <ellipse cx="40" cy="37" rx="11" ry="7" fill="#fff" opacity=".72" transform="rotate(-30 40 37)"/>
        </symbol>

        <!-- 3 · gummy square -->
        <symbol id="candy-3" viewBox="0 0 100 100">
          <rect x="18" y="18" width="64" height="64" rx="18" fill="url(#g3)"/>
          <rect x="27" y="27" width="46" height="46" rx="12" fill="#fff" opacity=".16"/>
          <ellipse cx="39" cy="36" rx="10" ry="6" fill="#fff" opacity=".64" transform="rotate(-27 39 36)"/>
        </symbol>

        <!-- 4 · lollipop -->
        <symbol id="candy-4" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="31" fill="url(#g4)"/>
          <g stroke="#fff" stroke-opacity=".62" stroke-width="7" fill="none" stroke-linecap="round">
            <path d="M50 23 A27 27 0 0 1 77 50"/>
            <path d="M50 37 A13 13 0 0 1 63 50"/>
          </g>
          <ellipse cx="36" cy="36" rx="9" ry="5.5" fill="#fff" opacity=".6" transform="rotate(-30 36 36)"/>
        </symbol>

        <!-- 5 · grape cluster -->
        <symbol id="candy-5" viewBox="0 0 100 100">
          <circle cx="36" cy="40" r="17" fill="url(#g5)"/>
          <circle cx="64" cy="40" r="17" fill="url(#g5)"/>
          <circle cx="50" cy="64" r="18" fill="url(#g5)"/>
          <circle cx="31" cy="34" r="5" fill="#fff" opacity=".6"/>
          <circle cx="59" cy="34" r="5" fill="#fff" opacity=".5"/>
          <circle cx="45" cy="58" r="5" fill="#fff" opacity=".45"/>
        </symbol>

        <!-- 6 · heart -->
        <symbol id="candy-6" viewBox="0 0 100 100">
          <path d="M50 82 C12 56 14 32 29 26 C41 21 48 30 50 37 C52 30 59 21 71 26 C86 32 88 56 50 82 Z" fill="url(#g6)"/>
          <ellipse cx="36" cy="40" rx="9" ry="6" fill="#fff" opacity=".6" transform="rotate(-32 36 40)"/>
        </symbol>

        <!-- 7 · star drop -->
        <symbol id="candy-7" viewBox="0 0 100 100">
          <path d="M50 16 L61 40 L86 43 L67 60 L73 85 L50 72 L27 85 L33 60 L14 43 L39 40 Z" fill="url(#g7)"/>
          <ellipse cx="42" cy="38" rx="8" ry="5" fill="#fff" opacity=".62" transform="rotate(-30 42 38)"/>
        </symbol>
      </defs>
    </svg>

    <div class="game">
      <header class="hud">
        <a class="hud-back" href="../../" aria-label="Back to tutu">
          <span aria-hidden="true">&#8592;</span>
        </a>
        <div class="hud-stat">
          <span class="hud-label">Level</span>
          <strong class="hud-value" id="hud-level">1</strong>
        </div>
        <div class="hud-title">
          <span class="hud-level-name" id="hud-level-name">Sweet Start</span>
          <span class="hud-left"><span id="hud-remaining">0</span> left</span>
        </div>
        <div class="hud-stat hud-stat-score">
          <span class="hud-label">Score</span>
          <strong class="hud-value" id="hud-score">0</strong>
        </div>
      </header>

      <div class="playfield" id="playfield">
        <div class="board-area" id="board-area"></div>

        <div class="tray" id="tray" role="group" aria-label="Match tray">
          <div class="tray-slots" id="tray-slots"></div>
        </div>
        <!-- Candy tiles are injected here as absolutely positioned nodes so
             a tile can fly from the board into the tray in one transition. -->
      </div>

      <nav class="powerups" aria-label="Power-ups">
        <button class="pow" id="pow-undo" type="button">
          <span class="pow-icon" aria-hidden="true">&#8630;</span>
          <span class="pow-name">Undo</span>
          <span class="pow-count" id="count-undo">3</span>
        </button>
        <button class="pow" id="pow-shuffle" type="button">
          <span class="pow-icon" aria-hidden="true">&#8646;</span>
          <span class="pow-name">Shuffle</span>
          <span class="pow-count" id="count-shuffle">2</span>
        </button>
        <button class="pow" id="pow-hint" type="button">
          <span class="pow-icon" aria-hidden="true">&#9733;</span>
          <span class="pow-name">Hint</span>
          <span class="pow-count" id="count-hint">3</span>
        </button>
      </nav>

      <p class="live-region sr-only" id="live" role="status" aria-live="polite"></p>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-burst" id="sheet-burst" aria-hidden="true"></div>
        <h2 class="sheet-title" id="sheet-title">Sugarsnap</h2>
        <p class="sheet-text" id="sheet-text"></p>
        <div class="sheet-score" id="sheet-score" hidden>
          <span class="sheet-score-label">Score</span>
          <strong id="sheet-score-value">0</strong>
        </div>
        <div class="sheet-actions" id="sheet-actions"></div>
      </div>
    </div>

    <script src="sugarsnap.js"></script>
  </body>
</html>
